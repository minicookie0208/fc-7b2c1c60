<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>見面會小卡</title>
<meta name="description" content="三語滑動小卡">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1638">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="見面會小卡">
<style>
  :root {
    --bg1: #2a1638;
    --bg2: #4a2152;
    --card: #fffaf6;
    --ink: #2b1d2e;
    --muted: #7a6680;
    --accent: #ff5c8a;
    --accent-2: #ffb3c7;
    --rec: #e5304a;
    --ok: #2f9e6a;
    --line: rgba(255,255,255,.14);
    --font: system-ui, -apple-system, "Segoe UI", "Leelawadee UI", Thonburi, "Noto Sans Thai",
            "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: #fff;
    background: radial-gradient(120% 90% at 20% 0%, var(--bg2), var(--bg1) 60%) fixed, var(--bg1);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .view { position: fixed; inset: 0; display: none; flex-direction: column; }
  .view.active { display: flex; }

  /* ---------- Start screen ---------- */
  #start { overflow-y: auto; padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b)); align-items: center; }
  .start-inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 18px; }
  .brand { text-align: center; margin-top: 8px; }
  .brand .logo { font-size: 56px; line-height: 1; }
  .brand h1 { margin: 10px 0 4px; font-size: 26px; letter-spacing: .02em; }
  .brand p { margin: 0; color: rgba(255,255,255,.7); font-size: 15px; }
  .panel { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; color: rgba(255,255,255,.85); font-weight: 600; }
  .panel .hint { font-size: 13px; color: rgba(255,255,255,.6); margin: 8px 0 0; line-height: 1.5; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { padding: 12px 8px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1.5px solid transparent; font-size: 15px; line-height: 1.35; }
  .seg button small { display: block; opacity: .65; font-size: 13px; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,92,138,.18); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 12px 16px; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 15px; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 700; font-size: 19px; padding: 16px; border-radius: 16px; width: 100%; box-shadow: 0 8px 24px rgba(255,92,138,.35); }
  .btn-primary:disabled { opacity: .45; box-shadow: none; }
  .status { font-size: 14px; color: rgba(255,255,255,.75); }
  .status.ok { color: #7ee2b0; }
  .status.err { color: #ff9aa9; }
  #installBox[hidden], #installBtn[hidden] { display: none; }

  #lock { align-items: center; justify-content: center; padding: 24px 20px; }
  #lock .start-inner { gap: 14px; }
  #lock input {
    width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: rgba(0,0,0,.2); color: #fff; font: inherit; font-size: 18px; text-align: center; -webkit-user-select: text; user-select: text;
  }
  #lock input:focus { outline: none; border-color: var(--accent); }

  /* ---------- Deck ---------- */
  #deck { padding-top: var(--safe-t); padding-bottom: var(--safe-b); background: var(--card); color: var(--ink); }
  #deck .icon-btn, #deck .nav { background: rgba(43,29,46,.07); }
  #deck .dots i { background: rgba(43,29,46,.18); }
  #deck .dots i.on { background: var(--accent); }
  #deck .swipe-hint { color: #a893ad; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 4px; gap: 8px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); font-size: 20px; display: grid; place-items: center; flex: none; }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.3); transition: all .25s; }
  .dots i.on { width: 22px; background: var(--accent); }
  .track {
    flex: 1; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: center; scroll-snap-stop: always; display: grid; place-items: stretch; }
  /* 卡片滿版：整個畫面就是卡片 */
  .card {
    width: 100%; min-width: 0; height: 100%;
    background: var(--card); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center;
    padding: clamp(12px, 3vw, 32px) clamp(18px, 5vw, 56px) clamp(20px, 3vw, 36px); gap: calc(clamp(8px, 1.8vh, 18px) * var(--k, 1));
    position: relative; overflow-x: hidden; overflow-y: auto;
  }
  .to { font-size: 15px; font-weight: 700; color: #fff; background: var(--accent); padding: 5px 14px; border-radius: 99px; letter-spacing: .02em; }
  .emoji { font-size: calc(clamp(44px, 9vh, 80px) * var(--k, 1)); line-height: 1; }
  .th { font-size: calc(clamp(22px, 5.4vw, 50px) * var(--k, 1)); font-weight: 700; line-height: 1.55; margin: 0; max-width: 100%; overflow-wrap: anywhere; }
  .en { font-size: calc(clamp(17px, 3.2vw, 28px) * var(--k, 1)); font-weight: 600; margin: 0; color: #4b3550; line-height: 1.35; }
  .zh { font-size: calc(clamp(15px, 2.6vw, 22px) * var(--k, 1)); margin: 0; color: var(--muted); line-height: 1.45; }
  .card.compact .emoji { font-size: calc(clamp(32px, 6vh, 56px) * var(--k, 1)); }
  .card.compact .th { font-size: calc(clamp(20px, 4.4vw, 40px) * var(--k, 1)); line-height: 1.5; }
  .card.compact .en { font-size: calc(clamp(15px, 2.6vw, 22px) * var(--k, 1)); }
  .card.compact .zh { font-size: calc(clamp(14px, 2.2vw, 18px) * var(--k, 1)); }
  /* 倒過來的區塊固定在最上緣，其餘內容在剩下的空間置中 */
  .card::after { content: ""; margin-top: auto; }
  .mine {
    margin-bottom: auto; flex: none;
    transform: rotate(180deg); width: 100%; max-width: 620px;
    background: #f7eef4; border-radius: 14px; padding: 8px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .mine .zh { color: #5a4560; }
  .rom { margin: 0; font-size: calc(clamp(13px, 2vw, 17px) * var(--k, 1)); color: #9a7fa0; line-height: 1.4; font-style: italic; }
  .card.compact .rom { font-size: calc(clamp(12px, 1.8vw, 15px) * var(--k, 1)); }
  .num { position: absolute; bottom: 12px; right: 18px; font-size: 13px; color: #b9a8bd; }
  .navbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 18px 14px; }
  .nav { width: 64px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.1); font-size: 26px; }
  .nav:disabled { opacity: .25; }
  .swipe-hint { font-size: 13px; color: rgba(255,255,255,.55); }

  /* ---------- Record / sign cards ---------- */
  .rec-area { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 2px; }
  .rec-btn {
    width: calc(clamp(84px, 14vh, 120px) * var(--k, 1)); height: calc(clamp(84px, 14vh, 120px) * var(--k, 1)); border-radius: 50%;
    background: var(--rec); color: #fff; font-size: calc(clamp(34px, 5.5vh, 48px) * var(--k, 1));
    display: grid; place-items: center; box-shadow: 0 10px 30px rgba(229,48,74,.4);
    position: relative;
  }
  .rec-btn:active { transform: scale(.96); }
  .rec-btn.recording::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--rec);
    animation: pulse 1.2s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  .rec-label { font-size: 15px; color: var(--muted); line-height: 1.4; }
  .rec-label b { color: var(--ink); }
  .timer { font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; color: var(--rec); }
  .done-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .card .btn { background: #f1e6ee; color: var(--ink); font-size: 15px; }
  .card .btn-go { background: var(--accent); color: #fff; font-weight: 700; }
  audio { width: min(100%, 360px); }
  .saved { color: var(--ok); font-size: 14px; font-weight: 600; }

  .card.sign { justify-content: flex-start; padding-top: clamp(22px, 3.5vh, 36px); }
  .pads { flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .pad-wrap { flex: 1; width: 100%; min-height: 96px; position: relative; }
  .pad {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: #fff; border: 2.5px dashed var(--pc, #e3c9d6); border-radius: 18px; touch-action: none; display: block;
  }
  .pad-hint { position: absolute; inset: 0; display: grid; place-items: center; color: var(--pc, #d6c2cf); opacity: .45; font-size: clamp(18px, 3vw, 26px); pointer-events: none; font-weight: 600; }
  .pad-name {
    position: absolute; top: 8px; left: 10px; z-index: 1; pointer-events: none;
    background: var(--pc); color: #fff; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
  }
  .pad-clear {
    position: absolute; top: 6px; right: 8px; z-index: 1; background: #f1e6ee; color: var(--ink);
    font-size: 13px; padding: 5px 10px; border-radius: 99px;
  }
  .pad-clear[hidden] { display: none; }
  .sign-img { flex: 1; min-height: 0; max-width: 100%; object-fit: contain; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px #eee; }

  /* ---------- Gallery ---------- */
  #recs { background: var(--bg1); padding: calc(10px + var(--safe-t)) 0 var(--safe-b); }
  #recs header { display: flex; align-items: center; gap: 10px; padding: 6px 16px 12px; border-bottom: 1px solid var(--line); }
  #recs header h2 { margin: 0; font-size: 20px; flex: 1; }
  .rec-list { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 640px; width: 100%; margin: 0 auto; }
  .rec-item { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .rec-item .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
  .rec-item .meta span { color: rgba(255,255,255,.6); font-size: 13px; }
  .rec-item img { width: 100%; border-radius: 12px; background: #fff; }
  .rec-item .row .btn { flex: 1; text-align: center; }
  .btn-danger { background: rgba(229,48,74,.18); color: #ffb0bb; }
  .empty { text-align: center; color: rgba(255,255,255,.6); padding: 40px 10px; line-height: 1.6; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%) translateY(20px);
    background: rgba(20,10,25,.92); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px;
    opacity: 0; transition: all .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (orientation: landscape) and (max-height: 520px) {
    .emoji { font-size: 36px; }
    .th { font-size: clamp(20px, 4.5vh + 1vw, 38px); }
  }
</style>
</head>
<body>

<!-- ========== 開始畫面 ========== -->
<section id="lock" class="view">
  <form class="start-inner" id="lockForm" autocomplete="off">
    <div class="brand"><div class="logo">🔒</div><h1>見面會小卡</h1><p>請輸入密碼</p></div>
    <input type="password" id="pwInput" placeholder="密碼" autocomplete="current-password">
    <button type="submit" class="btn-primary" id="unlockBtn">解鎖</button>
    <p class="status" id="lockStatus" style="text-align:center"></p>
    <p class="hint" style="text-align:center;color:rgba(255,255,255,.55);font-size:13px">這台裝置解鎖一次後會記住，之後離線也能直接打開。</p>
  </form>
</section>

<section id="start" class="view">
  <div class="start-inner">
    <div class="brand">
      <div class="logo">💌</div>
      <h1>見面會小卡</h1>
      <p id="subtitle"></p>
    </div>

    <div class="panel">
      <h2>1. 泰文語氣（會影響句尾用字）</h2>
      <div class="seg" id="genderSeg">
        <button type="button" data-g="f">女生<small>句尾用 ค่ะ / คะ，我 = ฉัน</small></button>
        <button type="button" data-g="m">男生<small>句尾用 ครับ，我 = ผม</small></button>
      </div>
    </div>

    <div class="panel">
      <h2>2. 先測試一下錄音</h2>
      <div class="row">
        <button type="button" class="btn" id="micTestBtn">🎙️ 錄 3 秒並播放</button>
        <span class="status" id="micStatus"></span>
      </div>
      <p class="hint">出發前務必先測試一次，並允許使用麥克風，這樣現場才不會跳出權限視窗浪費時間。</p>
    </div>

    <div class="panel" id="installBox" hidden>
      <h2>📲 安裝到主畫面（離線使用）</h2>
      <button type="button" class="btn" id="installBtn" hidden>安裝這個 App</button>
      <p class="hint" id="installHint"></p>
    </div>

    <p class="status" id="offlineStatus" style="text-align:center"></p>

    <button type="button" class="btn-primary" id="goBtn" disabled>開始 ▶</button>
    <button type="button" class="btn" id="openRecsFromStart" style="align-self:center">📂 我的收藏（錄音與簽名）</button>
    <button type="button" class="btn" id="lockBtn" style="align-self:center;background:none;opacity:.6;font-size:13px">🔒 鎖上這台裝置</button>
  </div>
</section>

<!-- ========== 卡片 ========== -->
<section id="deck" class="view">
  <div class="topbar">
    <button type="button" class="icon-btn" id="homeBtn" aria-label="回首頁">🏠</button>
    <div class="dots" id="dots"></div>
    <button type="button" class="icon-btn" id="openRecsFromDeck" aria-label="我的收藏">📂</button>
  </div>
  <div class="track" id="track"></div>
  <div class="navbar">
    <button type="button" class="nav" id="prevBtn" aria-label="上一張">‹</button>
    <span class="swipe-hint">Swipe ← →</span>
    <button type="button" class="nav" id="nextBtn" aria-label="下一張">›</button>
  </div>
</section>

<!-- ========== 我的收藏 ========== -->
<section id="recs" class="view">
  <header>
    <button type="button" class="icon-btn" id="closeRecs" aria-label="返回">←</button>
    <h2>我的收藏</h2>
  </header>
  <div class="rec-list" id="recList"></div>
</section>

<div class="toast" id="toast"></div>

const store = {

function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fill(text) {
  const f = settings.g !== 'm';
  return text
    .replace(/\{p\}/g, f ? 'ค่ะ' : 'ครับ')
    .replace(/\{q\}/g, f ? 'คะ' : 'ครับ')
    .replace(/\{i\}/g, f ? 'ฉัน' : 'ผม');
}
function fillRom(text) {
  const f = settings.g !== 'm';
  return text
    .replace(/\{[pq]\}/g, f ? 'kha' : 'khrap')
    .replace(/\{i\}/g, f ? 'chan' : 'phom');
}
const lines = (s) => esc(fill(s)).replace(/\n/g, '<br>');
const romLines = (s) => esc(fillRom(s)).replace(/\n/g, '<br>');

/* ---------- IndexedDB（存錄音與簽名） ---------- */
const db = {
  _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res, rej) => {
      const r = indexedDB.open('fancards', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('recs', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._p;
  },
  async tx(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction('recs', mode); const s = t.objectStore('recs');
      const out = fn(s);
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  put(rec) { return this.tx('readwrite', s => s.put(rec)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  all() { return this.tx('readonly', s => s.getAll()); }
};
async function saveItem(kind, label, blob, extra) {
  const item = Object.assign({ id: Date.now(), created: new Date().toISOString(), kind, label, mime: blob.type, data: await blob.arrayBuffer() }, extra);
  try { await db.put(item); return true; }
  catch (e) { toast('儲存失敗：' + (e && e.message || e), 4000); return false; }
}

/* ---------- 錄音 ---------- */
function pickMime() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  for (const m of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']) {
    if (MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}
function extFor(mime) {
  if (/png/.test(mime)) return 'png';
  if (/mp4|m4a|aac/.test(mime)) return 'm4a';
  if (/ogg/.test(mime)) return 'ogg';
  return 'webm';
}
function micSupported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function micErrorText(e) {
  const n = e && e.name;
  if (!window.isSecureContext) return '需要用 https 網址開啟才能錄音';
  if (n === 'NotAllowedError' || n === 'SecurityError') return '麥克風權限被拒絕，請到設定中允許';
  if (n === 'NotFoundError') return '找不到麥克風';
  return '無法使用麥克風（' + (n || e) + '）';
}

// 通用錄音器：start() 開始，stop() 結束並回傳 {blob, mime, duration}
function createRecorder() {
  let rec, stream, chunks = [], t0 = 0, resolveStop;
  return {
    async start() {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const mime = pickMime();
      rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const type = rec.mimeType || mime || 'audio/mp4';
        stream.getTracks().forEach(t => t.stop());
        resolveStop({ blob: new Blob(chunks, { type }), mime: type, duration: (performance.now() - t0) / 1000 });
      };
      rec.start(1000);
      t0 = performance.now();
    },
    stop() {
      return new Promise((res) => {
        resolveStop = res;
        if (rec && rec.state !== 'inactive') rec.stop(); else res(null);
      });
    },
    elapsed() { return (performance.now() - t0) / 1000; }
  };
}

/* ---------- 開始畫面 ---------- */
function renderStart() {
  document.querySelectorAll('#genderSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === settings.g)));
  $('goBtn').disabled = !settings.g;
  $('goBtn').textContent = settings.g ? '開始 ▶' : '請先選擇泰文語氣';
}
$('genderSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  settings.g = b.dataset.g; saveSettings(); renderStart();
});

$('micTestBtn').addEventListener('click', async () => {
  const st = $('micStatus'), btn = $('micTestBtn');
  if (!micSupported()) { st.className = 'status err'; st.textContent = '這個瀏覽器不支援錄音'; return; }
  btn.disabled = true;
  const r = createRecorder();
  try {
    await r.start();
  } catch (e) { st.className = 'status err'; st.textContent = micErrorText(e); btn.disabled = false; return; }
  st.className = 'status'; st.textContent = '錄音中… 說句話試試';
  await new Promise(res => setTimeout(res, 3000));
  const out = await r.stop();
  st.textContent = '播放中…';
  const a = new Audio(URL.createObjectURL(out.blob));
  a.onended = () => { st.className = 'status ok'; st.textContent = '✓ 有聽到聲音就代表可以用'; btn.disabled = false; };
  a.onerror = () => { st.className = 'status err'; st.textContent = '錄到了但無法播放'; btn.disabled = false; };
  a.play().catch(() => { st.className = 'status ok'; st.textContent = '✓ 錄音成功'; btn.disabled = false; });
});

let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('deck').classList.contains('active')) keepAwake(); });

$('goBtn').addEventListener('click', () => {
  buildDeck();
  showView('deck');
  goTo(0, false);
  keepAwake();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
});

// 中文＋羅馬拼音放在卡片最上面、轉 180 度，讓拿著平板的自己從對面看得懂
function cardInner(c, to) {
  return `<div class="mine">
      <p class="zh">${lines(c.zh)}</p>
      ${c.rom ? `<p class="rom">${romLines(c.rom)}</p>` : ''}
    </div>
    ${to ? `<div class="to">${esc(to)}</div>` : ''}
    <div class="emoji">${c.emoji}</div>
    <p class="th" lang="th">${lines(c.th)}</p>
    <p class="en" lang="en">${lines(c.en)}</p>`;
}
const numTag = (i) => `<span class="num">${i + 1} / ${CARDS.length}</span>`;
const cardEl = (i) => document.querySelector(`#track .slide:nth-child(${i + 1}) .card`);

// 內容放不下時，把字級一起縮小到剛好塞得下（最小縮到 50%）
function fitCard(el) {
  if (!el || !el.clientHeight) return;
  let k = 1;
  el.style.setProperty('--k', k);
  while (el.scrollHeight > el.clientHeight + 1 && k > 0.5) {
    k = Math.round((k - 0.05) * 100) / 100;
    el.style.setProperty('--k', k);
  }
}
const fitAll = () => document.querySelectorAll('#track .card').forEach(fitCard);

function buildDeck() {
  if (active) { clearInterval(active.timerId); active.recorder.stop(); active = null; }
  const track = $('track');
  track.innerHTML = CARDS.map(() => '<div class="slide"><div class="card"></div></div>').join('');
  CARDS.forEach((c, i) => {
    if (c.type === 'record') renderRecCard(i, 'idle');
    else if (c.type === 'sign') renderSignCard(i, 'idle');
    else { const el = cardEl(i); el.innerHTML = cardInner(c) + numTag(i); if (fill(c.th).length > 60) el.classList.add('compact'); }
  });
  $('dots').innerHTML = CARDS.map(() => '<i></i>').join('');
}

        <button type="button" class="rec-btn" aria-label="開始錄音">🎙️</button>
        <div class="rec-label"><b lang="th">กดเพื่ออัดเสียง</b> · 按下開始錄音</div>
      </div>` + numTag(i);
    card.querySelector('.rec-btn').onclick = () => startRecording(i);
  } else if (state === 'recording') {
    card.innerHTML = cardInner(c, c.to) + `
      <div class="rec-area">
        <button type="button" class="rec-btn recording" aria-label="停止錄音">■</button>
        <div class="timer">0:00</div>
        <div class="rec-label"><b lang="th">กำลังอัดเสียง…</b> Recording… · 再按一次停止</div>
      </div>` + numTag(i);
    card.querySelector('.rec-btn').onclick = stopRecording;
  } else if (state === 'done') {
    card.innerHTML = cardInner(c.thanks, c.to) + `
      <div class="rec-area">
        <audio controls src="${data.url}"></audio>
        <div class="saved">✓ 已存到「我的收藏」</div>
        <div class="done-actions">
          <button type="button" class="btn" data-act="again">🔁 再錄一段</button>
          ${i < CARDS.length - 1 ? '<button type="button" class="btn btn-go" data-act="next">下一張 ›</button>' : ''}
        </div>
      </div>` + numTag(i);
    card.querySelector('[data-act="again"]').onclick = () => renderRecCard(i, 'idle');
    const nx = card.querySelector('[data-act="next"]'); if (nx) nx.onclick = () => goTo(i + 1);
  }
  fitCard(card);
}

async function startRecording(i) {
  if (active) await stopRecording();
  if (!micSupported()) { toast('這個瀏覽器不支援錄音'); return; }
  const recorder = createRecorder();
  try { await recorder.start(); }
  catch (e) { toast(micErrorText(e), 3500); return; }
  renderRecCard(i, 'recording');
  const timerEl = cardEl(i).querySelector('.timer');
  active = { i, recorder, timerId: setInterval(() => {
    const s = recorder.elapsed();
    timerEl.textContent = fmt(s);
    if (s >= MAX_REC_SECONDS) stopRecording();
  }, 250) };
}
async function stopRecording() {
  if (!active) return;
  const { i, recorder, timerId } = active; active = null; clearInterval(timerId);
  const out = await recorder.stop();
  if (!out || !out.blob.size) { toast('沒有錄到聲音，請再試一次'); renderRecCard(i, 'idle'); return; }
  await saveItem('audio', CARDS[i].label, out.blob, { duration: out.duration });
  renderRecCard(i, 'done', { url: URL.createObjectURL(out.blob) });
}

/* ----- 簽名卡 ----- */
// 簽名框：預設一格黑筆；想分格可在 cards.js 加 pads: [{ name, color }, ...]
function renderSignCard(i, state, data) {
  const c = CARDS[i], card = cardEl(i);
  const pads = c.pads && c.pads.length ? c.pads : [{ name: '', color: '#111111' }];
  card.className = 'card compact sign';
  if (state === 'idle') {
    card.innerHTML = cardInner(c, c.to) + `
      <div class="pads">${pads.map(p => `
        <div class="pad-wrap"${p.name ? ` style="--pc:${esc(p.color)}"` : ''}>
          <canvas class="pad"></canvas>
          ${p.name ? `<span class="pad-name">${esc(p.name)}</span>` : ''}
          <div class="pad-hint" lang="th">เซ็นตรงนี้ · Sign here</div>
          <button type="button" class="pad-clear" hidden>🧽 清除</button>
        </div>`).join('')}
      </div>
      <div class="done-actions">
        <button type="button" class="btn btn-go" data-act="save" disabled>✓ 完成</button>
      </div>` + numTag(i);
    const saveBtn = card.querySelector('[data-act="save"]');
    const ctrls = [...card.querySelectorAll('.pad-wrap')].map((w, k) =>
      setupPad(w, pads[k].color, () => { saveBtn.disabled = !ctrls.some(x => x.dirty()); }));
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      const blob = await composeSignatures(ctrls.map((x, k) => ({ canvas: x.canvas, name: pads[k].name, color: pads[k].color })));
      if (!blob) { toast('簽名存檔失敗'); saveBtn.disabled = false; return; }
      await saveItem('sign', c.label, blob);
      renderSignCard(i, 'done', { url: URL.createObjectURL(blob) });
    };
  } else if (state === 'done') {
    card.innerHTML = cardInner(c.thanks) + `
      <img class="sign-img" src="${data.url}" alt="簽名">
      <div class="saved">✓ 已存到「我的收藏」</div>
      <div class="done-actions"><button type="button" class="btn" data-act="again">✍️ 再簽一張</button></div>` + numTag(i);
    card.querySelector('[data-act="again"]').onclick = () => renderSignCard(i, 'idle');
  }
  fitCard(card);
}
// 一格簽名框：固定筆色，回傳 { canvas, dirty() }
function setupPad(wrap, color, onChange) {
  const canvas = wrap.querySelector('canvas'), hint = wrap.querySelector('.pad-hint');
  const clearBtn = wrap.querySelector('.pad-clear');
  const ctx = canvas.getContext('2d');
  let drawing = false, last = null, dirty = false, strokes = [];
  function size() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (!r.width || !r.height) return;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function line(a, b, col) {
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(3, (b.p || .5) * 7); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(s => { for (let k = 1; k < s.pts.length; k++) line(s.pts[k - 1], s.pts[k], s.color); if (s.pts.length === 1) line(s.pts[0], s.pts[0], s.color); });
  }
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure || .5 }; };
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    drawing = true; last = pos(e); strokes.push({ color, pts: [last] }); line(last, last, color);
    if (!dirty) { dirty = true; hint.style.display = 'none'; clearBtn.hidden = false; onChange(); }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = pos(e); line(last, p, color); strokes[strokes.length - 1].pts.push(p); last = p;
  });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  clearBtn.onclick = () => {
    strokes = []; redraw(); dirty = false; hint.style.display = ''; clearBtn.hidden = true; onChange();
  };
  new ResizeObserver(size).observe(canvas);
  return { canvas, dirty: () => dirty };
}

// 把幾格簽名上下拼成一張白底 PNG，每格左上角標名字
async function composeSignatures(parts) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(...parts.map(p => p.canvas.width));
  const gap = Math.round(12 * dpr);
  const h = parts.reduce((s, p) => s + p.canvas.height, 0) + gap * (parts.length - 1);
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d');
  o.fillStyle = '#ffffff'; o.fillRect(0, 0, w, h);
  let y = 0;
  parts.forEach((p, k) => {
    if (k) { o.fillStyle = '#eee3ea'; o.fillRect(0, y - gap / 2 - dpr, w, 2 * dpr); }
    o.drawImage(p.canvas, 0, y);
    if (p.name) {
      o.font = `700 ${Math.round(15 * dpr)}px ${getComputedStyle(document.body).fontFamily}`;
      o.fillStyle = p.color; o.textBaseline = 'top';
      o.fillText(p.name, Math.round(12 * dpr), y + Math.round(10 * dpr));
    }
    y += p.canvas.height + gap;
  });
  return new Promise(res => out.toBlob(res, 'image/png'));
}

/* ----- 換頁 ----- */
const track = $('track');
function slideWidth() { return track.clientWidth || 1; }
function goTo(i, smooth = true) {
  i = Math.max(0, Math.min(CARDS.length - 1, i));
  track.scrollTo({ left: i * slideWidth(), behavior: smooth ? 'smooth' : 'auto' });
  setIdx(i);
}
function setIdx(i) {
  idx = i;
  document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i));
  $('prevBtn').disabled = i === 0;
  $('nextBtn').disabled = i === CARDS.length - 1;
}
let scrollRaf = 0;
track.addEventListener('scroll', () => {
  cancelAnimationFrame(scrollRaf);
  scrollRaf = requestAnimationFrame(() => {
    const i = Math.round(track.scrollLeft / slideWidth());
    if (i !== idx) setIdx(i);
  });
}, { passive: true });
window.addEventListener('resize', () => { if ($('deck').classList.contains('active')) track.scrollTo({ left: idx * slideWidth() }); });
// 卡片頁出現或畫面大小改變（轉向、分割畫面）時重新縮放
let lastTrackSize = '';
new ResizeObserver(() => {
  const s = track.clientWidth + 'x' + track.clientHeight;
  if (!track.clientHeight) { lastTrackSize = ''; return; }
  if (s !== lastTrackSize) { lastTrackSize = s; fitAll(); }
}).observe(track);
$('prevBtn').addEventListener('click', () => goTo(idx - 1));
$('nextBtn').addEventListener('click', () => goTo(idx + 1));
document.addEventListener('keydown', (e) => {
  if (!$('deck').classList.contains('active')) return;
  if (e.key === 'ArrowRight') goTo(idx + 1);
  if (e.key === 'ArrowLeft') goTo(idx - 1);
});
$('homeBtn').addEventListener('click', async () => {
  if (active) await stopRecording();
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch {}
  renderStart(); showView('start');
});

/* ---------- 我的收藏 ---------- */
let recsReturnTo = 'start';
const objectUrls = [];
async function openRecs() {
  if (active) await stopRecording();
  recsReturnTo = $('deck').classList.contains('active') ? 'deck' : 'start';
  showView('recs');
  await renderRecs();
}
async function renderRecs() {
  objectUrls.splice(0).forEach(u => URL.revokeObjectURL(u));
  const list = $('recList');
  let items = [];
  try { items = await db.all(); } catch (e) { list.innerHTML = `<div class="empty">讀取失敗：${esc(e && e.message || e)}</div>`; return; }
  items.sort((a, b) => b.id - a.id);
  if (!items.length) { list.innerHTML = '<div class="empty">還沒有收藏<br>在錄音卡按 🎙️、在簽名卡簽名後就會出現在這裡</div>'; return; }
  list.innerHTML = '';
  items.forEach((r) => {
    const kind = r.kind || 'audio';
    const d = new Date(r.created);
    const pad = (n) => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    const label = r.label || r.name || '';
    const fname = `${label ? label.replace(/[\\/:*?"<>|']/g, '') + '-' : ''}${kind === 'sign' ? '簽名' : '錄音'}-${stamp}.${extFor(r.mime)}`;
    const blob = new Blob([r.data], { type: r.mime });
    const file = new File([blob], fname, { type: r.mime });
    const url = URL.createObjectURL(blob); objectUrls.push(url);
    const item = document.createElement('div');
    item.className = 'rec-item';
    const when = d.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    item.innerHTML = `
      <div class="meta"><b>${kind === 'sign' ? '✍️ 簽名' : '🎤 錄音'}${label ? ' · ' + esc(label) : ''}</b>
        <span>${when}${kind === 'audio' ? ' · ' + fmt(r.duration) : ''}</span></div>
      ${kind === 'sign' ? `<img src="${url}" alt="簽名">` : `<audio controls preload="metadata" src="${url}"></audio>`}
      <div class="row">
        <button type="button" class="btn" data-act="share">📤 分享／儲存</button>
        <button type="button" class="btn btn-danger" data-act="del">🗑️ 刪除</button>
      </div>`;
    item.querySelector('[data-act="share"]').onclick = async () => {
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: fname }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      toast('已下載：' + fname);
    };
    item.querySelector('[data-act="del"]').onclick = async () => {
      if (!confirm('確定要刪除嗎？刪除後無法復原。')) return;
      await db.del(r.id); renderRecs();
    };
    list.appendChild(item);
  });
}
$('openRecsFromStart').addEventListener('click', openRecs);
$('openRecsFromDeck').addEventListener('click', openRecs);
$('closeRecs').addEventListener('click', () => {
  document.querySelectorAll('#recList audio').forEach(a => a.pause());
  showView(recsReturnTo);
  if (recsReturnTo === 'deck') track.scrollTo({ left: idx * slideWidth() });
});

/* ---------- PWA：安裝與離線 ---------- */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let deferredPrompt = null;
function renderInstall() {
  const box = $('installBox');
  if (isStandalone()) { box.hidden = true; return; }
  box.hidden = false;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  $('installBtn').hidden = !deferredPrompt;
  $('installHint').textContent = ios
    ? 'iPad／iPhone：用 Safari 開啟 → 點上方「分享」→「加入主畫面」。'
    : (deferredPrompt ? '' : '安卓／Windows：用 Chrome 或 Edge 開啟 → 瀏覽器選單 →「安裝應用程式」或「加到主畫面」。');
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
$('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; renderInstall();
});
window.addEventListener('appinstalled', renderInstall);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    const s = $('offlineStatus'); s.className = 'status ok'; s.textContent = '✓ 已可離線使用';
  }).catch(() => {
    const s = $('offlineStatus'); s.className = 'status err'; s.textContent = '離線功能啟用失敗，請確認是用 https 網址開啟';
  });
}

/* ---------- 解鎖 ---------- */
const b64 = (t) => Uint8Array.from(atob(t), ch => ch.charCodeAt(0));
const fingerprint = () => ENC ? ENC.ct.slice(0, 32) : '';
async function decryptData(pw) {
  const te = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function applyData(d) { CARDS = d.cards; $('subtitle').textContent = d.subtitle || ''; }
$('lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const st = $('lockStatus'), pw = $('pwInput').value;
  if (!pw) return;
  if (!window.crypto || !crypto.subtle) { st.className = 'status err'; st.textContent = '需要用 https 網址開啟'; return; }
  $('unlockBtn').disabled = true; st.className = 'status'; st.textContent = '解鎖中…';
  try {
    const d = await decryptData(pw);
    store.set('fancards.unlocked', { fp: fingerprint(), data: d });
    applyData(d); $('pwInput').value = ''; st.textContent = '';
    renderStart(); showView('start');
  } catch {
    st.className = 'status err'; st.textContent = '密碼不對，再試一次';
  }
  $('unlockBtn').disabled = false;
});
$('lockBtn').addEventListener('click', () => {
  if (!confirm('鎖上後要重新輸入密碼才能使用（錄音和簽名不會被刪除）。確定嗎？')) return;
  store.set('fancards.unlocked', null); CARDS = []; showView('lock');
});

renderInstall();
const cached = store.get('fancards.unlocked', null);
if (cached && cached.fp === fingerprint()) { applyData(cached.data); renderStart(); showView('start'); }
else showView('lock');

// 預覽用：網址加上 #preview=3 會直接顯示第 3 張卡
const pv = /preview=(\d+)/.exec(location.hash);
if (pv && CARDS.length) { if (!settings.g) settings.g = 'f'; buildDeck(); showView('deck'); requestAnimationFrame(() => goTo(+pv[1] - 1, false)); }
</script>
